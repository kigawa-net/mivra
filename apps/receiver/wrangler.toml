name = "mivra-receiver"
main = "src/index.ts"
compatibility_date = "2026-10-30"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "mivra-db"
database_id = "local-mivra-db"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MAIL_STORAGE"
bucket_name = "mivra-mail-data"

[[queues.producers]]
binding = "RECEIVE_QUEUE"
queue = "mivra-receive-queue"

[vars]
ENVIRONMENT = "development"

# Staging Environment
[env.staging]
name = "mivra-receiver-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mivra-db-staging"
database_id = "staging-d1-placeholder"

[[env.staging.r2_buckets]]
binding = "MAIL_STORAGE"
bucket_name = "mivra-mail-data-staging"

[[env.staging.queues.producers]]
binding = "RECEIVE_QUEUE"
queue = "mivra-receive-queue-staging"

# Production Environment
[env.production]
name = "mivra-receiver-production"
[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mivra-db-production"
database_id = "prod-d1-placeholder"

[[env.production.r2_buckets]]
binding = "MAIL_STORAGE"
bucket_name = "mivra-mail-data-prod"

[[env.production.queues.producers]]
binding = "RECEIVE_QUEUE"
queue = "mivra-receive-queue-prod"
